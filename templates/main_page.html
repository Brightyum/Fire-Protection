<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소방안전 빅데이터</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      background-color: #1e1e2f;
      color: white;
      font-size: 20px;
      text-align: center;
    }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .chat-column {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user-logs {
      background-color: #ffffff;
      border-right: 1px solid #ccc;
    }
    .bot-answers {
      background-color: #f0f8ff;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      border: 1px solid #ccc;
    }
    .user-msg {
      background-color: #fff;
      color: #333;
    }
    .bot-msg {
      background-color: #d1eaff;
      color: #000;
    }
    form {
      display: flex;
      flex-direction: column;
      padding: 12px;
      background: white;
      border-top: 1px solid #ccc;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    input, textarea {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    input[name="name"] {
      width: 150px;
    }
    textarea {
      flex: 1;
      resize: none;
    }
    button {
      padding: 8px 16px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      align-self: flex-end;
    }
    button:hover {
      background-color: #357bd8;
    }
  </style>
</head>
<body>
  <header>소방안전 빅데이터</header>

  <main>
    <section class="chat-column user-logs" id="user-column">
      <!-- 사용자 질문 로그 -->
    </section>

    <section class="chat-column bot-answers" id="bot-column">
      <!-- AI 응답 출력 -->
    </section>
  </main>

  <form id="qa-form">
    <div class="input-row">
      <input type="text" name="name" placeholder="이름을 입력하세요" required />
      <textarea name="question" rows="2" placeholder="질문을 입력하세요..." required></textarea>
    </div>
    <button type="submit">전송</button>
  </form>

  <script>
    const form = document.getElementById("qa-form");
    const userColumn = document.getElementById("user-column");
    const botColumn = document.getElementById("bot-column");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const name = formData.get("name").trim();
      const question = formData.get("question").trim();

      if (!name || !question) return;

      // 사용자 메시지 출력
      const userBubble = document.createElement("div");
      userBubble.classList.add("bubble", "user-msg");
      userBubble.innerHTML = `<strong>${name}</strong><br>${question}`;
      userColumn.appendChild(userBubble);
      userColumn.scrollTop = userColumn.scrollHeight;

      // AI 응답 버블 생성
      const botBubble = document.createElement("div");
      botBubble.classList.add("bubble", "bot-msg");
      botBubble.innerHTML = `<strong>AI</strong><br>`;
      botColumn.appendChild(botBubble);
      botColumn.scrollTop = botColumn.scrollHeight;

      // 입력 초기화
      form.reset();

      // 서버에 질문 전송 후 응답 스트리밍
      const response = await fetch("/stream", {
        method: "POST",
        body: new URLSearchParams({ name, question }),
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let botAnswer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        botAnswer += chunk;
        botBubble.innerHTML = `<strong>AI</strong><br>${botAnswer}`;
        botColumn.scrollTop = botColumn.scrollHeight;
      }
    });
  </script>
</body>
</html>
