<!-- templates/qa_stream.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 Q&A</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      background-color: #1e1e2f;
      color: white;
      font-size: 20px;
      text-align: center;
    }
    main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background-color: #d1eaff;
      color: #000;
      border-bottom-right-radius: 0;
    }
    .bot {
      align-self: flex-start;
      background-color: #ffffff;
      color: #333;
      border-bottom-left-radius: 0;
      border: 1px solid #ccc;
    }
    form {
      display: flex;
      padding: 12px;
      background: white;
      border-top: 1px solid #ccc;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      margin-left: 10px;
      padding: 0 16px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357bd8;
    }
  </style>
</head>
<body>
  <header>실시간 Q&A 챗봇</header>

  <main id="chat-box">
    <!-- 메시지가 여기에 출력됨 -->
  </main>

  <form id="qa-form">
    <textarea name="question" rows="2" placeholder="질문을 입력하세요..." required></textarea>
    <button type="submit">전송</button>
  </form>

  <script>
    const form = document.getElementById("qa-form");
    const chatBox = document.getElementById("chat-box");

    const appendMessage = (message, type) => {
      const div = document.createElement("div");
      div.classList.add("bubble", type);
      div.textContent = message;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const question = formData.get("question");
      if (!question.trim()) return;

      appendMessage(question, "user");
      form.reset();

      const response = await fetch("/stream", {
        method: "POST",
        body: formData,
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");

      let botMessage = "";
      const botBubble = document.createElement("div");
      botBubble.classList.add("bubble", "bot");
      chatBox.appendChild(botBubble);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        botMessage += chunk;
        botBubble.textContent = botMessage;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });
  </script>
</body>
</html>
